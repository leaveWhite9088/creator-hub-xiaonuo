<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>林澈个人主页（基础基线）</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 8px; background: #fff; color: #222; }
    html[data-theme="dark"] body { background: #1e1e1e; color: #bbb; }
    .top { position: sticky; top: 0; background: #eee; padding: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    html[data-theme="dark"] .top { background: #2a2a2a; }
    /* 典型弱模型通病：激活按钮采用低对比度浅蓝配浅字 */
    button[aria-pressed="true"] { background: #dbeafe; color: #60a5fa; }
    .card { border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; min-width: 340px; }
    button { font-size: 12px; padding: 2px 6px; }
    .hidden { display: none !important; }
    .err { color: #ef4444; font-size: 12px; }
    .cmp-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #ddd; padding: 10px; }
    .cmp-modal { border: 2px solid #333; padding: 12px; background: #fff; margin: 10px 0; }
  </style>
</head>
<body>
  <header class="top">
    <strong>林澈的主页</strong>
    <div>
      <button type="button" data-testid="workbench-undo" id="undoBtn" disabled>撤销</button>
      <button type="button" data-testid="workbench-redo" id="redoBtn" disabled>重做</button>
      <button type="button" data-testid="theme-toggle" id="themeBtn">深浅色</button>
    </div>
  </header>

  <main id="listView">
    <section data-testid="hero-section">
      <h1 id="heroName">林澈 · 独立 AI 研究</h1>
      <p id="heroBio">加载中...</p>
      <p data-testid="demo-notice" id="demoNotice">演示说明加载中...</p>
    </section>

    <section>
      <input type="text" data-testid="search-input" id="searchInput" placeholder="搜索项目或文章..." />
      <select data-testid="sort-control" id="sortSelect"></select>
      <div data-testid="category-filter" id="catBox" style="margin:6px 0;"></div>
      <button type="button" data-testid="favorite-filter" id="favFilter" aria-pressed="false">只看收藏</button>
    </section>

    <div data-testid="empty-state" id="emptyState" class="hidden">未找到任何匹配结果。</div>

    <div data-testid="compare-panel" id="comparePanel" class="cmp-modal hidden">
      <h3>项目对比</h3>
      <!-- 典型弱模型捷径：放一个写死坐标的静态占位 SVG，不随对比项目动态计算重绘 -->
      <svg data-testid="compare-chart" width="220" height="120" viewBox="0 0 220 120">
        <rect x="10" y="20" width="60" height="60" fill="#93c5fd" />
        <text x="15" y="15" font-size="11">静态示意</text>
      </svg>
      <div id="compareBody"></div>
      <button type="button" data-testid="compare-close" id="compareClose">关闭对比</button>
    </div>

    <h2>演示项目</h2>
    <div data-testid="project-list" id="projectList"></div>

    <h2>顾问合作规划台</h2>
    <section data-testid="estimator-section" style="border:1px solid #ccc;padding:8px;margin:10px 0;">
      <div id="estModes"></div>
      <div id="estAddons" style="margin:6px 0;"></div>
      <div>
        <select data-testid="est-scale" id="estScale"></select>
        <select data-testid="est-start-week" id="estStartWeek"></select>
      </div>
      <p data-testid="est-result" id="estResult">测算中...</p>
      <div data-testid="est-milestones" id="estMilestones"></div>
      <div id="estWarn" class="err"></div>
      <button type="button" data-testid="est-reset" id="estReset">重置</button>
      <button type="button" data-testid="est-apply-to-contact" id="estApply">带入合作留言</button>
    </section>

    <h2>实测手记</h2>
    <div data-testid="article-list" id="articleList"></div>

    <section data-testid="contact-section" style="margin-top:20px;padding-bottom:60px;">
      <h2>联系林澈</h2>
      <p id="contactMail">联系邮箱：linche@example.com（演示邮箱）</p>
      <div><input type="text" data-testid="contact-name" id="cName" placeholder="姓名" /></div>
      <div><input type="email" data-testid="contact-email" id="cEmail" placeholder="邮箱" /></div>
      <div><textarea data-testid="contact-message" id="cMsg" placeholder="合作留言"></textarea></div>
      <div data-testid="contact-error" id="cErr" class="err hidden"></div>
      <button type="button" data-testid="contact-submit" id="cSub">提交咨询</button>
      <button type="button" data-testid="contact-copy" id="cCopy">复制回执</button>
      <pre data-testid="contact-receipt" id="cOut"></pre>
    </section>
  </main>

  <div data-testid="compare-bar" id="compareBar" class="cmp-bar hidden">
    <span id="compareCount">已选 0 项</span>
    <button type="button" data-testid="compare-open" id="compareOpen">查看对比</button>
    <button type="button" data-testid="compare-clear" id="compareClear">清空对比</button>
  </div>

  <section data-testid="detail-view" id="detailView" class="hidden">
    <button type="button" data-testid="detail-back" id="detailBack">返回列表</button>
    <h2 data-testid="detail-title" id="detailTitle"></h2>
    <nav data-testid="article-toc" id="articleToc"></nav>
    <div data-testid="detail-body" id="detailBody"></div>
    <div id="articleNav">
      <button type="button" data-testid="article-prev" id="artPrev">上一篇</button>
      <button type="button" data-testid="article-next" id="artNext">下一篇</button>
    </div>
  </section>

  <script src="mock_backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
